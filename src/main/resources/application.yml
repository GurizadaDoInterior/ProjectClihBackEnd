spring:
  application:
    name: clih-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    enabled: false
    path: /v3/api-docs

app:
  security:
    mode: deny-all
    local-subject: local-development-user
  cors:
    allowed-origins: []

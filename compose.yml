services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clih
      POSTGRES_USER: clih
      POSTGRES_PASSWORD: clih
    ports:
      - "5432:5432"
    volumes:
      - clih-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clih -d clih"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clih-postgres:
